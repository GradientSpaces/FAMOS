# Stage 1 (pre-training): procedural objects only.
defaults:
  - model: train
  - data: stage1
  - trainer: train
  - loggers: wandb
  - _self_

seed: 7
data_root: ${oc.env:FAMOS_DATA_ROOT,./data}
