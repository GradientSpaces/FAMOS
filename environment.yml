# pytorch3d has no prebuilt wheel for PyTorch 2.8; build it after creating the
# environment (see README.md).
name: famos
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - numpy=1.26
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - --find-links https://data.pyg.org/whl/torch-2.8.0+cu128.html
      - torch==2.8.0
      - torchvision==0.23.0
      - lightning==2.5.2
      - diffusers==0.33.0
      - flash-attn @ https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.8cxx11abiTRUE-cp310-cp310-linux_x86_64.whl
      - torch-scatter==2.1.2+pt28cu128
      - einops==0.8.1
      - h5py==3.13.0
      - hydra-core==1.3.2
      - matplotlib==3.10.3
      - pillow
      - pyrender==0.1.45
      - pytz==2025.2
      - rich==14.0.0
      - scipy==1.15.2
      - tqdm==4.67.1
      - trimesh==4.6.4
      - wandb==0.20.1
      - yacs==0.1.8
